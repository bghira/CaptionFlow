worker:
  # This process connects to CaptionFlow with the normal community worker token.
  server: "wss://caption.example.com:8765"
  token: "replace-with-captionflow-worker-token"
  name: "my-api-pool"

  # Caption policy normally belongs in orchestrator.inference.output_processing
  # and works identically with direct vLLM. Optional local overrides:
  # output_processing:
  #   refusal_markers: []
  #   validate_json_output: true
  #   repair_invalid_json_escapes: true
  #   canonicalize_json_output: true
  #   normalize_yxyx_bboxes: true
  #   deduplicate_json_elements: true

  # Provider API keys stay in this process. They are never sent to CaptionFlow.
  openai_compatible:
    # Keep enough local items ready to fill all discovered request slots.
    batch_size: 64
    include_image: true
    image_detail: "auto"
    image_format: "jpeg"
    image_quality: 90

    # Provider-specific fields applied only to fallback requests. Prefer shared
    # inference.retry_response_format for constraints that also apply to direct
    # vLLM workers.
    # retry_extra_body:
    #   response_format:
    #     type: "json_object"

    endpoints:
      - name: "zai-coding-plan"
        base_url: "https://api.z.ai/api/coding/paas/v4"
        api_key_env: "ZAI_API_KEY"
        model: "glm-5.3-flash"
        initial_concurrency: 1
        max_concurrency: 32
        probe_after_successes: 8
        # Set this when the plan publishes an RPM ceiling. Omit it to rely on
        # adaptive concurrency and provider rate-limit responses.
        # requests_per_minute: 600
        timeout_seconds: 120
        max_retries: 6
        # Provider-specific fields shared by primary and fallback requests can
        # be placed here, including response_format or chat-template options.
        # extra_body:
        #   response_format:
        #     type: "json_object"

      # Add more accounts or providers to aggregate their capacity. Model names
      # can differ between endpoints.
      # - name: "secondary"
      #   base_url_env: "CAPTIONFLOW_SECONDARY_BASE_URL"
      #   api_key_env: "CAPTIONFLOW_SECONDARY_API_KEY"
      #   model: "another-vision-model"
      #   initial_concurrency: 1
      #   max_concurrency: 16

  when_finished: "stay_connected"
