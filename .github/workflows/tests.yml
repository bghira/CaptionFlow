# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'pytest.ini'
      - 'requirements.metal.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'pytest.ini'
      - 'requirements.metal.txt'
      - '.github/workflows/tests.yml'

jobs:
  worker-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Resolve Linux GPU worker dependencies
      run: |
        python -m pip install "uv==0.13.8"
        uv pip compile pyproject.toml --extra vllm --extra dev \
          --python-version "${{ matrix.python-version }}" \
          --python-platform x86_64-manylinux_2_28 \
          --output-file /tmp/worker-requirements.txt
    - name: Resolve Apple Silicon dependencies
      env:
        MACOSX_DEPLOYMENT_TARGET: '14.0'
      run: |
        uv pip compile pyproject.toml --extra apple --extra dev \
          --python-version "${{ matrix.python-version }}" \
          --python-platform aarch64-apple-darwin \
          --output-file /tmp/apple-requirements.txt
    - name: Resolve stable Metal runtime
      if: matrix.python-version == '3.12'
      env:
        MACOSX_DEPLOYMENT_TARGET: '15.0'
      run: |
        uv pip compile requirements.metal.txt \
          --python-version 3.12 --python-platform aarch64-apple-darwin \
          --output-file /tmp/metal-requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"  # Installs caption-flow with dev dependencies

    - name: Run tests
      run: |
        pytest tests/ -v --cov=caption_flow --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'  # Only upload once
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black mypy
    
    - name: Run linters
      run: |
        ruff check src tests || true
        black --check src tests || true
        mypy src --ignore-missing-imports || true  # Non-blocking type checks
